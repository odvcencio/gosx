# The gosx-docs Secret is provisioned out-of-band. It must contain a
# `session-secret` key; never commit the secret value to this manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gosx-docs
  namespace: draco-quest
  labels:
    app: gosx-docs
  annotations:
    kubernetes.io/change-cause: "Deploy gosx-docs __GIT_REVISION__ at __BUILT_AT__ (sha256:__IMAGE_DIGEST__)"
spec:
  replicas: 1
  # Keep enough rollout history for an immediate operator rollback without
  # retaining an unbounded set of old ReplicaSets.
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gosx-docs
  template:
    metadata:
      labels:
        app: gosx-docs
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: isr-static
          # The image root remains read-only; ISR refreshes only this bounded
          # copy of the prerendered static tree.
          emptyDir:
            sizeLimit: 128Mi
      initContainers:
        - name: stage-isr
          image: harbor.draco.quest/orchard/gosx-docs@sha256:__IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - cp -R /opt/gosx-docs/static/. /isr-static/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: isr-static
              mountPath: /isr-static
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: gosx-docs
          # scripts/deploy-gosx-docs.sh requires an immutable digest and
          # substitutes it into this checked-in placeholder before apply.
          image: harbor.draco.quest/orchard/gosx-docs@sha256:__IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: isr-static
              mountPath: /opt/gosx-docs/static
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: PUBLIC_URL
              value: https://gosx.m31labs.dev
            - name: GOSX_DOCS_REVISION
              value: __GIT_REVISION__
            - name: GOSX_DOCS_BUILT_AT
              value: __BUILT_AT__
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: gosx-docs
                  key: session-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gosx-docs
  namespace: draco-quest
spec:
  selector:
    app: gosx-docs
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gosx-docs
  namespace: draco-quest
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    traefik.ingress.kubernetes.io/router.priority: "20"
spec:
  ingressClassName: traefik
  rules:
    - host: gosx.m31labs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gosx-docs
                port:
                  name: http
  tls:
    - hosts:
        - gosx.m31labs.dev
      secretName: gosx-docs-tls
