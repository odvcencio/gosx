<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoSX rooms client</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      html, body { margin: 0; height: 100%; background: #0b0b0d; color: #f5f5ef; }
      body { display: grid; grid-template-rows: auto 1fr; gap: 8px; padding: 10px; box-sizing: border-box; }
      #status { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #b8b8b0; font-variant-numeric: tabular-nums; min-height: 1.4em; }
      canvas { width: 100%; height: 100%; min-height: 0; object-fit: contain; background: #0b0f17; border: 1px solid #2b2b2f; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="status" role="status" aria-live="off">Loading the game client…</div>
    <canvas id="stage" width="1280" height="800" aria-label="Rooms game board. Arrow keys or W A S D to move, Shift to boost." tabindex="0"></canvas>
    <script src="./wasm_exec.js"></script>
    <script type="module">
      const go = new Go();
      const wasm = await WebAssembly.instantiateStreaming(fetch("./main.wasm"), go.importObject);
      go.run(wasm.instance);
    </script>
  </body>
</html>
