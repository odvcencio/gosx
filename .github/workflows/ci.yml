name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch whitespace check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          zero_sha=0000000000000000000000000000000000000000
          base_sha="$EVENT_BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "$zero_sha" ]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi
          echo "checking whitespace in ${EVENT_NAME} patch ${base_sha}..${EVENT_HEAD_SHA}"
          git diff --check "$base_sha" "$EVENT_HEAD_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Release gate
        run: make release-gate

  # go-tests: every root package except cmd/gosx, plus the editor, fuzz and
  # desktop gates. The production-build CLI suite runs in go-cli-tests beside
  # this job, so its ~6 minute TinyGo integration tests no longer serialize all
  # other Go checks. The go-race-tests job now runs the race detector in
  # parallel, so this lane needs neither TinyGo nor Node. A recent PR-path run
  # measured 12m01s without its race step (run 31573355088, job 94042534187),
  # so it keeps a 15-minute fail-safe.
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Danmuji
        run: go install github.com/odvcencio/danmuji/cmd/danmuji@v0.3.2

      - name: Format check
        run: make fmt-check

      - name: Danmuji generated spec check
        run: make verify-danmuji

      # This fails on package overlap/gaps and if a focused race package loses
      # either its tests or its production concurrency evidence. Its report
      # records the exact package counts and reasons in the job log.
      - name: CI package partition validation
        run: make test-ci-partitions

      - name: Non-CLI unit and integration tests
        run: make test-unit

      # editor/ is a nested Go module, so nothing above reaches it: `go list
      # ./editor/...` fails from the root and `make test` never compiles it.
      # That left 3404 non-test lines and 68 tests with no gate on any runner.
      # The target builds, vets and tests the module against the working tree.
      - name: Editor module tests
        run: make test-editor

      - name: Fuzz smoke tests
        run: make test-fuzz-smoke

      # The desktop host holds 3520 lines behind a windows build tag against 62
      # lines of windows-gated test, and this runner is Linux. release.yml
      # cross-compiles the binary, but nothing compiled the windows TEST
      # binaries, so a broken desktop test could not fail anywhere. This runs the
      # portable tests and links both windows test binaries.
      - name: Desktop tests and Windows cross-compile gate
        run: make test-desktop

  # go-race-tests: the race detector gates split out of go-tests so they run
  # in parallel instead of serializing after the unit lane. This lane needs
  # neither TinyGo nor Node. The pull-request path runs the focused
  # test-race-pr suite within the shared job ceiling. The push path instead
  # race-builds every package and runs the full package set except nine named,
  # validated perf/ouroboros tests whose real-repository evidence scans spend
  # tens of minutes in deterministic parsing/Brotli work under instrumentation.
  # Ordinary tests still gate all nine. A second scoped perf/ouroboros race run
  # retains every fixture-sized test plus direct concurrent coverage of its
  # mutex-protected network capture. The broad lane includes the expensive BC7
  # and vector-search kernels omitted from pull requests and keeps a 40-minute
  # per-package alarm inside this 50-minute job ceiling.
  go-race-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Focused shared-state race tests
        if: github.event_name == 'pull_request'
        run: make test-race-pr

      # Pushes reaching main/master retain exhaustive package coverage, with
      # only the validated deterministic evidence recomputations split out.
      - name: Full repository race tests
        if: github.event_name == 'push'
        run: make test-race

  # cmd/gosx/build_test.go runs real production builds and therefore requires
  # TinyGo. Isolating it gives PRs a ~6 minute Go critical path while preserving
  # every production-build assertion and the standalone CLI build gate. A cold
  # merged-main run reached Go's default 10-minute package timeout in the final
  # generated-docs fixture, so the suite has a 15-minute Go timeout inside this
  # 20-minute job ceiling.
  go-cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install TinyGo
        env:
          TINYGO_VERSION: 0.41.1
        run: scripts/install-ci-tinygo.sh

      - name: CLI production-build integration tests
        run: make test-cli

      - name: Build CLI
        run: make build-cli

  # js-tests: Node for `node --test`, plus Go — `make test-js` also runs the
  # unit tests of cmd/buildbootstrap and then `go run . --check` (the bundle
  # staleness gate), and both need a Go toolchain. The unit tests matter here
  # because cmd/buildbootstrap writes every shipped client bundle: --check
  # catches a stale bundle, and only the tests catch a wrong one. No
  # TinyGo/Chrome setup: nothing here shells out to either.
  js-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Node also runs the pinned strict TypeScript compiler for the generated
      # ABI contract. make test-js performs the reproducible npm ci.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript runtime contract tests
        run: make test-js

  # wasm-tests: Go + TinyGo. Also needs Node, because `go test -exec
  # go_js_wasm_exec` (used by test-wasm / test-wasm-islands) shells out to
  # `node` under the hood (see $(go env GOROOT)/lib/wasm/go_js_wasm_exec).
  # Pinning Node 22 here (same as js-tests) preserves exact prior behavior
  # instead of relying on whatever Node ships by default on the runner image.
  wasm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TinyGo
        env:
          TINYGO_VERSION: 0.41.1
        run: scripts/install-ci-tinygo.sh

      # Guards the zero-CGo portability claim: README states every package
      # compiles to WASM. It had stopped being true and nothing noticed,
      # because `make test` builds for the host and test-wasm below builds
      # only ./client/wasm. This builds every package.
      - name: Every package builds for js/wasm
        run: make build-wasm-all

      - name: WASM runtime tests
        run: make test-wasm

      - name: Island-only WASM runtime tests
        run: make test-wasm-islands

      # motion is one Go evaluator that drives the server IR, the native
      # renderer, the client VM and the WASM exports. This target proves the
      # native and js/wasm builds agree on floats, against a native-generated
      # golden corpus. No other gate ran it, so a divergence could ship.
      - name: Motion cross-target float parity gate
        run: make test-motion-parity

      # physics is one rigid body engine that serves the server's authoritative
      # step and the client's predicted step. This target replays the golden
      # corpus under js/wasm and demands bit equality, so the two steps cannot
      # drift. Verified locally: 7 scenarios, 3600 steps, 48074 contact points,
      # bit exact with zero tolerance. The gate needs a build that does not fuse
      # a floating point multiply and add, which is GOAMD64 v2 or lower (the Go
      # default) and js/wasm, which has no fused instruction.
      - name: Physics cross-target float parity gate
        run: make test-physics-parity

      - name: WASM size-budget gate
        run: make wasm-size-budget

      - name: Production water bundle smoke test
        run: make test-water-prod

      - name: Build WASM runtime
        run: make build-runtime

  # browser-tests: Go + Chrome + TinyGo. No Node install — the browser
  # executes the WASM itself; nothing here shells out to `node`.
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      # TinyGo is required: TestProductionBuildRunsMixedTinyGoAndStandardGoWASM
      # (e2e/go_wasm_mixed_prod_e2e_test.go) runs a real production GoSX build
      # (`go run ./cmd/gosx build --prod`), which requires TinyGo on PATH.
      - name: Install TinyGo
        env:
          TINYGO_VERSION: 0.41.1
        run: scripts/install-ci-tinygo.sh

      - name: Browser docs E2E gate
        env:
          GOSX_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: make test-e2e

      # This fixture test validates that the committed MP4 has browser-readable
      # metadata. It deliberately requires an explicit browser so a Chrome
      # binary that merely happens to exist on the generic unit runner cannot
      # turn the unit partition into a flaky browser lane.
      - name: Ouroboros media metadata browser smoke
        # setup-chrome supplies Chromium, whose Linux build omits the MP4
        # codec exercised by this fixture. GitHub's Ubuntu image also ships
        # codec-capable Google Chrome; resolve it explicitly so this remains
        # a browser-lane proof instead of silently skipping the media check.
        run: |
          chrome_bin="$(command -v google-chrome-stable || command -v google-chrome)"
          GOSX_CHROME_BIN="$chrome_bin" go test ./examples/ouroboros-corpus -run '^TestFixtureMP4BrowserLoadsMetadata$' -count=1

      # The perf driver's own browser tests. They sit behind `//go:build
      # browser` and nothing passed that tag before this step existed, so 11
      # tests never compiled anywhere.
      #
      # GOSX_CHROME_NO_SANDBOX is required: the runner cannot give Chrome a user
      # namespace. The make target also sets GOSX_REQUIRE_CHROME, so a broken
      # Chrome install fails this step instead of skipping every test in it.
      - name: Perf driver browser tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GOSX_CHROME_NO_SANDBOX: "1"
        run: make test-perf-browser

      - name: Perf budget gate
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: make perf-budget-ci

  # test: kept as a lightweight aggregate so the `test` check name still
  # exists for any external required-check configuration that references it
  # by name. As of this split, `main` branch protection on this repo has no
  # required_status_checks configured (verified via `gh api
  # repos/odvcencio/gosx/branches/main/protection`), so nothing currently
  # depends on this name — this job is defensive insurance, not a fix for a
  # known break.
  test:
    runs-on: ubuntu-latest
    needs:
      - go-tests
      - go-race-tests
      - go-cli-tests
      - js-tests
      - wasm-tests
      - browser-tests
    timeout-minutes: 5

    steps:
      - name: All test jobs passed
        run: echo "go-tests, go-race-tests, go-cli-tests, js-tests, wasm-tests, and browser-tests all passed"

  # Opt-in certification for a self-hosted runner with a real GPU. Generic
  # GitHub runners use SwiftShader and cannot produce meaningful WebGPU frame
  # timing. Set WATER_WEBGPU_RUNNER to the runner label to enable this job.
  water-webgpu-certification:
    if: ${{ vars.WATER_WEBGPU_RUNNER != '' }}
    runs-on: ${{ vars.WATER_WEBGPU_RUNNER }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Certify water on hardware WebGPU
        env:
          GOSX_WATER_E2E_REQUIRE_WEBGPU: "1"
          GOSX_E2E_CHROME: ${{ vars.WATER_WEBGPU_CHROME }}
        run: go test -tags e2e -timeout 30m -run 'TestWater' ./e2e
