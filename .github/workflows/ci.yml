name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Shallow checkout: the release gate only needs the checked-out
          # tree. Exact event base/head commits missing from the shallow
          # history are fetched individually by the whitespace-check step.
          fetch-depth: 1

      - name: Patch whitespace check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          zero_sha=0000000000000000000000000000000000000000
          base_sha="$EVENT_BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "$zero_sha" ]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git fetch --quiet --no-tags --depth=1 origin "$base_sha"
          fi
          # The event head may also be absent from the shallow history.
          if ! git cat-file -e "${EVENT_HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet --no-tags --depth=1 origin "$EVENT_HEAD_SHA"
          fi
          echo "checking whitespace in ${EVENT_NAME} patch ${base_sha}..${EVENT_HEAD_SHA}"
          git diff --check "$base_sha" "$EVENT_HEAD_SHA"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Release gate
        run: make release-gate

  # go-tests: every root package except cmd/gosx, plus the editor, fuzz and
  # desktop gates. The production-build CLI suite runs in go-cli-tests beside
  # this job, so its ~6 minute TinyGo integration tests no longer serialize all
  # other Go checks. The go-race-tests job now runs the race detector in
  # parallel, so this lane needs neither TinyGo nor Node. A main-path run
  # measured 14m10s (run 33836750032, job 100910735401), and a PR run reached
  # its final test gate at 14m59 before the 15-minute ceiling cancelled teardown
  # (run 33853282910, job 100960713148). A 20-minute fail-safe stays bounded
  # while allowing normal runner variance and post-step cleanup.
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Danmuji
        # Bounded retry for transient module-proxy errors; pinned args and
        # checksum validation are unchanged, and exhaustion fails the step.
        run: |
          set -eu
          attempt=1
          until go install github.com/odvcencio/danmuji/cmd/danmuji@v0.3.2; do
            echo "danmuji install attempt ${attempt}/3 failed" >&2
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done

      - name: Format check
        run: make fmt-check

      - name: Danmuji generated spec check
        run: make verify-danmuji

      # This fails on package overlap/gaps and if a focused race package loses
      # either its tests or its production concurrency evidence. Its report
      # records the exact package counts and reasons in the job log.
      - name: CI package partition validation
        run: make test-ci-partitions

      # Named convergence gate: validates the v1 boundary, case inventory,
      # CI ownership labels, and every evidence anchor before broad Go tests.
      - name: Scene3D v1 corpus contract
        run: go test ./scene/harness -run '^TestV1CorpusContract' -count=1

      - name: Non-CLI unit and integration tests
        run: make test-unit

      # editor/ is a nested Go module, so nothing above reaches it: `go list
      # ./editor/...` fails from the root and `make test` never compiles it.
      # That left 3404 non-test lines and 68 tests with no gate on any runner.
      # The target builds, vets and tests the module against the working tree.
      - name: Editor module tests
        run: make test-editor

      - name: Fuzz smoke tests
        run: make test-fuzz-smoke

      # The desktop host holds 3520 lines behind a windows build tag against 62
      # lines of windows-gated test, and this runner is Linux. release-governed.yml
      # cross-compiles the binary, but nothing compiled the windows TEST
      # binaries, so a broken desktop test could not fail anywhere. This runs the
      # portable tests and links both windows test binaries.
      - name: Desktop tests and Windows cross-compile gate
        run: make test-desktop

  # go-race-tests: the race detector gates split out of go-tests so they run
  # in parallel instead of serializing after the unit lane. This lane needs
  # neither TinyGo nor Node. The pull-request path runs the focused
  # test-race-pr suite within the shared job ceiling. The push path instead
  # race-builds every package and runs the full package set except nine named,
  # validated perf/ouroboros tests whose real-repository evidence scans spend
  # tens of minutes in deterministic parsing/Brotli work under instrumentation.
  # Ordinary tests still gate all nine. A second scoped perf/ouroboros race run
  # retains every fixture-sized test plus direct concurrent coverage of its
  # mutex-protected network capture. The broad lane includes the expensive BC7
  # and vector-search kernels omitted from pull requests and keeps a 40-minute
  # per-package alarm inside this 50-minute job ceiling.
  go-race-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Focused shared-state race tests
        if: github.event_name == 'pull_request'
        run: make test-race-pr

      # Pushes reaching main/master retain exhaustive package coverage, with
      # only the validated deterministic evidence recomputations split out.
      - name: Full repository race tests
        if: github.event_name == 'push'
        run: make test-race

  # cmd/gosx/build_test.go runs real production builds and therefore requires
  # TinyGo. Isolating it gives PRs a ~6 minute Go critical path while preserving
  # every production-build assertion and the standalone CLI build gate. A cold
  # merged-main run reached Go's default 10-minute package timeout in the final
  # generated-docs fixture, so the suite has a 15-minute Go timeout inside this
  # 20-minute job ceiling.
  go-cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install TinyGo
        env:
          TINYGO_VERSION: 0.41.1
        run: scripts/install-ci-tinygo.sh

      - name: CLI production-build integration tests
        run: make test-cli

      - name: Build CLI
        run: make build-cli

  # js-tests: Node for `node --test`, plus Go — `make test-js` also runs the
  # unit tests of cmd/buildbootstrap and then `go run . --check` (the bundle
  # staleness gate), and both need a Go toolchain. The unit tests matter here
  # because cmd/buildbootstrap writes every shipped client bundle: --check
  # catches a stale bundle, and only the tests catch a wrong one. No
  # TinyGo/Chrome setup: nothing here shells out to either.
  js-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Node also runs the pinned strict TypeScript compiler for the generated
      # ABI contract. make test-js performs the reproducible npm ci.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript runtime contract tests
        run: make test-js

  # wasm-tests: Go + TinyGo. Also needs Node, because `go test -exec
  # go_js_wasm_exec` (used by test-wasm / test-wasm-islands) shells out to
  # `node` under the hood (see $(go env GOROOT)/lib/wasm/go_js_wasm_exec).
  # Pinning Node 22 here (same as js-tests) preserves exact prior behavior
  # instead of relying on whatever Node ships by default on the runner image.
  wasm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TinyGo
        env:
          TINYGO_VERSION: 0.41.1
        run: scripts/install-ci-tinygo.sh

      # Guards the zero-CGo portability claim: README states every package
      # compiles to WASM. It had stopped being true and nothing noticed,
      # because `make test` builds for the host and test-wasm below builds
      # only ./client/wasm. This builds every package.
      - name: Every package builds for js/wasm
        run: make build-wasm-all

      - name: WASM runtime tests
        run: make test-wasm

      - name: Island-only WASM runtime tests
        run: make test-wasm-islands

      # motion is one Go evaluator that drives the server IR, the native
      # renderer, the client VM and the WASM exports. This target proves the
      # native and js/wasm builds agree on floats, against a native-generated
      # golden corpus. No other gate ran it, so a divergence could ship.
      - name: Motion cross-target float parity gate
        run: make test-motion-parity

      # physics is one rigid body engine that serves the server's authoritative
      # step and the client's predicted step. This target replays the golden
      # corpus under js/wasm and demands bit equality, so the two steps cannot
      # drift. Verified locally: 7 scenarios, 3600 steps, 48074 contact points,
      # bit exact with zero tolerance. The gate needs a build that does not fuse
      # a floating point multiply and add, which is GOAMD64 v2 or lower (the Go
      # default) and js/wasm, which has no fused instruction.
      - name: Physics cross-target float parity gate
        run: make test-physics-parity

      - name: WASM size-budget gate
        run: make wasm-size-budget

      - name: Production water bundle smoke test
        run: make test-water-prod

      - name: Build WASM runtime
        run: make build-runtime

  # scene3d-v1-browser-renderer-proof: one bounded four-mode renderer-contract
  # matrix. Hosted WebGPU uses a private target; canvas presentation remains a
  # release-pinned hardware obligation. Successful runs trap-clean artifacts;
  # failed runs upload every mode before the always cleanup step.
  scene3d-v1-browser-renderer-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up stable Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Scene3D CUBICSPLINE browser renderer proof
        env:
          GOSX_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          GOSX_EXPECTED_CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
          GOSX_SCENE3D_CUBIC_WEBGPU_TARGET: private-texture
        run: |
          set -eu
          if [ -z "${RUNNER_TEMP:-}" ] || [ "$RUNNER_TEMP" = "/" ]; then
            echo "unsafe RUNNER_TEMP" >&2
            exit 2
          fi
          artifact_dir="${RUNNER_TEMP}/gosx-cubic-proof"
          rm -rf -- "$artifact_dir"
          mkdir -p "$artifact_dir"
          proof_status=0
          trap 'if [ "$proof_status" -eq 0 ]; then rm -rf -- "$artifact_dir"; fi' EXIT
          set +e
          node client/js/testdata/scene3d-cubic-spline-browser-matrix.cjs "$GITHUB_WORKSPACE" "$artifact_dir"
          proof_status=$?
          set -e
          if [ "$proof_status" -ne 0 ] && [ -f "$artifact_dir/matrix-report.json" ]; then
            cat "$artifact_dir/matrix-report.json"
          fi
          exit "$proof_status"

      - name: Upload Scene3D proof diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: scene3d-v1-cubic-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gosx-cubic-proof
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean Scene3D proof artifacts
        if: ${{ always() }}
        run: |
          set -eu
          if [ -z "${RUNNER_TEMP:-}" ] || [ "$RUNNER_TEMP" = "/" ]; then
            echo "unsafe RUNNER_TEMP" >&2
            exit 2
          fi
          rm -rf -- "${RUNNER_TEMP}/gosx-cubic-proof"

  # scene3d-v1-adapter-proof: the real standard-Go WASM generic-hydrate seam,
  # native WebGL2 plus requested-WebGPU/native-or-typed-fallback evidence,
  # same-ID stale suppression, and the targeted hub-command/remount contract.
  # Success removes artifacts immediately; failure retains the report and
  # screenshots for seven days.
  scene3d-v1-adapter-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up stable Chrome for adapter proof
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Scene3D adapter hydrate browser proof
        env:
          GOSX_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          GOSX_EXPECTED_CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
        run: |
          set -eu
          if [ -z "${RUNNER_TEMP:-}" ] || [ "$RUNNER_TEMP" = "/" ]; then
            echo "unsafe RUNNER_TEMP" >&2
            exit 2
          fi
          artifact_dir="${RUNNER_TEMP}/gosx-adapter-proof"
          rm -rf -- "$artifact_dir"
          mkdir -p "$artifact_dir"
          proof_status=0
          trap 'if [ "$proof_status" -eq 0 ]; then rm -rf -- "$artifact_dir"; fi' EXIT
          set +e
          node client/js/testdata/scene3d-adapter-hydrate-browser.cjs "$GITHUB_WORKSPACE" "$artifact_dir"
          proof_status=$?
          set -e
          if [ "$proof_status" -ne 0 ] && [ -f "$artifact_dir/report.json" ]; then
            cat "$artifact_dir/report.json"
          fi
          exit "$proof_status"

      - name: Upload Scene3D adapter proof diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: scene3d-v1-adapter-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gosx-adapter-proof
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean Scene3D adapter proof artifacts
        if: ${{ always() }}
        run: |
          set -eu
          if [ -z "${RUNNER_TEMP:-}" ] || [ "$RUNNER_TEMP" = "/" ]; then
            echo "unsafe RUNNER_TEMP" >&2
            exit 2
          fi
          rm -rf -- "${RUNNER_TEMP}/gosx-adapter-proof"

  # browser-tests: Go + Chrome + TinyGo. The wider browser suite executes WASM
  # directly; the bounded Scene3D proof runs in its separately named job.
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      # TinyGo is required: TestProductionBuildRunsMixedTinyGoAndStandardGoWASM
      # (e2e/go_wasm_mixed_prod_e2e_test.go) runs a real production GoSX build
      # (`go run ./cmd/gosx build --prod`), which requires TinyGo on PATH.
      - name: Install TinyGo
        env:
          TINYGO_VERSION: 0.41.1
        run: scripts/install-ci-tinygo.sh

      - name: Browser docs E2E gate
        env:
          GOSX_E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: make test-e2e

      # This fixture test validates that the committed MP4 has browser-readable
      # metadata. It deliberately requires an explicit browser so a Chrome
      # binary that merely happens to exist on the generic unit runner cannot
      # turn the unit partition into a flaky browser lane.
      - name: Ouroboros media metadata browser smoke
        # setup-chrome supplies Chromium, whose Linux build omits the MP4
        # codec exercised by this fixture. GitHub's Ubuntu image also ships
        # codec-capable Google Chrome; resolve it explicitly so this remains
        # a browser-lane proof instead of silently skipping the media check.
        run: |
          chrome_bin="$(command -v google-chrome-stable || command -v google-chrome)"
          GOSX_CHROME_BIN="$chrome_bin" go test ./examples/ouroboros-corpus -run '^TestFixtureMP4BrowserLoadsMetadata$' -count=1

      # The perf driver's own browser tests. They sit behind `//go:build
      # browser` and nothing passed that tag before this step existed, so 11
      # tests never compiled anywhere.
      #
      # GOSX_CHROME_NO_SANDBOX is required: the runner cannot give Chrome a user
      # namespace. The make target also sets GOSX_REQUIRE_CHROME, so a broken
      # Chrome install fails this step instead of skipping every test in it.
      - name: Perf driver browser tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GOSX_CHROME_NO_SANDBOX: "1"
        run: make test-perf-browser

      # Perf budgets are release measurements, so their browser is a governed
      # fixture rather than the floating snapshot used by the compatibility
      # tests above. Run 33305212196 measured this exact snapshot green on the
      # same runtime/perf sources. Renew the pin only with a reviewed hosted
      # receipt; latest-browser coverage remains in the earlier steps.
      - name: Set up pinned Chromium for perf budget
        id: perf-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '1688711'

      - name: Verify pinned perf browser identity
        env:
          PERF_CHROME_PATH: ${{ steps.perf-chrome.outputs.chrome-path }}
          PERF_CHROME_VERSION: ${{ steps.perf-chrome.outputs.chrome-version }}
        run: |
          sh scripts/verify-perf-browser-identity.sh \
            "$PERF_CHROME_PATH" \
            "$PERF_CHROME_VERSION" \
            build/perf-browser-identity.txt

      - name: Perf budget gate
        env:
          CHROME_PATH: ${{ steps.perf-chrome.outputs.chrome-path }}
        run: make perf-budget-ci

      - name: Upload perf budget failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/perf-report.json
            build/perf-server.log
            build/perf-browser-identity.txt
          if-no-files-found: ignore
          retention-days: 7

  # test: kept as the lightweight aggregate required-check surface. It must
  # include release-gate so branch protection on the aggregate `test` check also
  # gates release policy and governed workflow topology. `always()` makes the
  # aggregate run after a failed/skipped dependency; the step then fails closed
  # unless every required dependency reports success.
  test:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - release-gate
      - go-tests
      - go-race-tests
      - go-cli-tests
      - js-tests
      - wasm-tests
      - scene3d-v1-browser-renderer-proof
      - scene3d-v1-adapter-proof
      - browser-tests
    timeout-minutes: 5

    steps:
      - name: All test jobs passed
        env:
          RELEASE_GATE_RESULT: ${{ needs.release-gate.result }}
          GO_TESTS_RESULT: ${{ needs.go-tests.result }}
          GO_RACE_TESTS_RESULT: ${{ needs.go-race-tests.result }}
          GO_CLI_TESTS_RESULT: ${{ needs.go-cli-tests.result }}
          JS_TESTS_RESULT: ${{ needs.js-tests.result }}
          WASM_TESTS_RESULT: ${{ needs.wasm-tests.result }}
          SCENE3D_V1_BROWSER_RENDERER_PROOF_RESULT: ${{ needs.scene3d-v1-browser-renderer-proof.result }}
          SCENE3D_V1_ADAPTER_PROOF_RESULT: ${{ needs.scene3d-v1-adapter-proof.result }}
          BROWSER_TESTS_RESULT: ${{ needs.browser-tests.result }}
        run: |
          set -eu
          for result in \
            "release-gate=$RELEASE_GATE_RESULT" \
            "go-tests=$GO_TESTS_RESULT" \
            "go-race-tests=$GO_RACE_TESTS_RESULT" \
            "go-cli-tests=$GO_CLI_TESTS_RESULT" \
            "js-tests=$JS_TESTS_RESULT" \
            "wasm-tests=$WASM_TESTS_RESULT" \
            "scene3d-v1-browser-renderer-proof=$SCENE3D_V1_BROWSER_RENDERER_PROOF_RESULT" \
            "scene3d-v1-adapter-proof=$SCENE3D_V1_ADAPTER_PROOF_RESULT" \
            "browser-tests=$BROWSER_TESTS_RESULT"
          do
            case "$result" in
              *=success) ;;
              *)
                echo "required test job did not succeed: $result" >&2
                exit 1
                ;;
            esac
          done
          echo "release-gate, go-tests, go-race-tests, go-cli-tests, js-tests, wasm-tests, scene3d-v1-browser-renderer-proof, scene3d-v1-adapter-proof, and browser-tests all passed"

  # Opt-in certification for a self-hosted runner with a real GPU. Generic
  # GitHub runners use SwiftShader and cannot produce meaningful WebGPU frame
  # timing. Set WATER_WEBGPU_RUNNER to the runner label to enable this job.
  water-webgpu-certification:
    if: ${{ vars.WATER_WEBGPU_RUNNER != '' }}
    runs-on: ${{ vars.WATER_WEBGPU_RUNNER }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Certify water on hardware WebGPU
        env:
          GOSX_WATER_E2E_REQUIRE_WEBGPU: "1"
          GOSX_E2E_CHROME: ${{ vars.WATER_WEBGPU_CHROME }}
        run: go test -tags e2e -timeout 30m -run 'TestWater' ./e2e
